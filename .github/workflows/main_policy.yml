name: Main PR policy

on:
  pull_request:
    branches: [main]

jobs:
  require-dev-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        run: |
            if [ "${{ github.head_ref }}" != "dev" ]; then
                echo "Pull requests into main must come from dev."
                echo "Actual source branch: ${{ github.head_ref }}"
                exit 1
            fi